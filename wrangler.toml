name = "cinemx"
compatibility_date = "2026-07-02"
main = "worker.js"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"

# After running `npx wrangler d1 create cinemax-movies`, add the generated block here:
# [[d1_databases]]
# binding = "DB"
# database_name = "cinemax-movies"
# database_id = "YOUR_DATABASE_ID"
# migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "CINEMAX_VIEW_COUNTER"
class_name = "MovieViewCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MovieViewCounter"]
